<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTH.zip - My Projects</title>
    <link rel="stylesheet" href="/css/css.css" />
    <link rel="stylesheet" href="/css/globals.css" />
    <link rel="stylesheet" href="/css/music.css" />
    <link rel="stylesheet" href="/css/about.css" />
    <link rel="stylesheet" href="/css/socials.css" />
    <link rel="stylesheet" href="/css/fs.css" />
    <link rel="stylesheet" href="/css/projects.css" />

    <script src="/external/jquery-3.7.1.js"></script>
    <script src="/external/gsap.min.js"></script>
    <script src="/external/barba.js"></script>
    <script src="/external/a1fc6f0f3a.js"></script>
    <script src="/scripts/js.js"></script>

    <link href="/img/favicon-light.png" rel="icon" media="(prefers-color-scheme: dark)" />
    <link href="/img/favicon-dark.png" rel="icon" media="(prefers-color-scheme: light)" />
</head>

<body data-barba="wrapper">
    <header class="gthHeader">
        <button class="button back-btn" title="Back"><i class="fas fa-chevron-left"></i></button>
        <a class="home button gthNav" title="Home" href="/"><i class="fa-solid fa-home"></i></a>
        <p class="subhead">my projects</p>
    </header>

    <main data-barba="container" data-barba-namespace="projects">
        <div class="projects-page">
            <div class="projects-header">
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" class="search-input" placeholder="Search apps..." />
                </div>

                <div class="view-options">
                    <button class="view-option-btn" data-option="show-details" title="Toggle Details">
                        <i class="fa-solid fa-circle-info"></i>
                    </button>
                    <div class="view-mode-selector">
                        <button class="view-mode-btn active" data-view="icon" title="Icon View">
                            <i class="fa-solid fa-icons"></i>
                        </button>
                        <button class="view-mode-btn" data-view="list" title="List View">
                            <i class="fa-solid fa-list"></i>
                        </button>
                        <button class="view-mode-btn" data-view="tile" title="Tile View">
                            <i class="fa-solid fa-table-cells-large"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="projects-container" data-view-mode="icon">
                <div class="apps-grid" id="appsGrid">
                    <!-- Apps will be dynamically loaded here -->
                </div>

                <div class="no-results" style="display: none;">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <p>No apps found</p>
                </div>
            </div>
        </div>
    </main>

    <script src="/scripts/snow.js"></script>
    <script src="/scripts/orbs.js"></script>
    <script src="/scripts/projects.js"></script>
</body>

</html>
