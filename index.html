<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTH.zip - Home</title>
    <link rel="stylesheet" href="css/css.css">
    <link rel="stylesheet" href="css/globals.css">
    <link rel="stylesheet" href="css/music.css">
    <link rel="stylesheet" href="css/about.css">
    <link rel="stylesheet" href="css/socials.css">
    <link rel="stylesheet" href="css/fs.css">

    <script src="external/jquery-3.7.1.js"></script>

    <script src="external/gsap.min.js"></script>

    <link href="img/favicon-dark.png" rel="icon" media="(prefers-color-scheme: light)" />

<body data-barba="wrapper" class="">
    <header class="gthHeader">
        <button class="button back-btn" title="Back"><i class="fas fa-chevron-left"></i></button>
        <a class="home button gthNav" title="Home" href="/"><i class="fa-solid fa-home"></i></a>
        <p class="subhead">home</p>
    </header>

    <main class="container" data-barba="container" data-barba-namespace="home">
        <p class="head">GTH.zip</p>

        <div class="tab-buttons"></div>
        <div class="homePages">
            <div class="outLinks page">
                <div class="outlink-wrapper">
                    <a href="/futur3sn0w" class="outlink gthNav visit-fs" title="My Brand">
                        <i class="fa-solid fa-snowflake"></i>
                        <img class="outlink-img" src="img/logo_square.png" alt="" draggable="false">
                    </a>
                    <p class="outlink-label">Futur3Sn0w</p>
                </div>

                <div class="outlink-wrapper wide">
                    <a href="/projects" class="outlink gthNav wide my-projects" title="My Projects">
                        <i class="fa-solid fa-icons"></i>
                        <img class="outlink-img" src="" alt="" draggable="false">
                        <i class="project-icon-large fa-solid fa-plus"></i>
                        <div class="infoLabels">
                            <p class="type"></p>
                            <p class="title"></p>
                            <p class="date"></p>
                        </div>
                    </a>
                    <p class="outlink-label">My Projects</p>
                </div>

                <div class="outlink-wrapper wide">
                    <a href="/music" class="outlink gthNav wide my-music" title="My Music">
                        <i class="fa-solid fa-headphones"></i>
                        <img class="outlink-img" src="" alt="" draggable="false">
                        <div class="infoLabels">
                            <p class="type"></p>
                            <p class="title"></p>
                            <p class="date"></p>
                        </div>
                    </a>
                    <p class="outlink-label">My Music (Beta)</p>
                </div>

                <div class="outlink-wrapper">
                    <a href="/about" class="outlink gthNav about-me" title="About Me">
                        <i class="fa-solid fa-user"></i>
                        <img class="outlink-img" src="img/me.jpg" alt="" draggable="false">
                    </a>
                    <p class="outlink-label">About Me</p>
                </div>
            </div>

            <div class="subTiles page" id="socialList"></div>
        </div>
    </main>

    <script src="scripts/snow.js"></script>
    <script src="scripts/orbs.js"></script>
